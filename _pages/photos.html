---
layout: single
title: "Photos"
permalink: /photos/
author_profile: false
---

<div class="photo-gallery">
  {% for photo in site.data.photos %}
    <figure class="photo-gallery__item{% if forloop.first %} photo-gallery__item--featured{% endif %}">
      <div class="photo-gallery__media">
        <img
          class="photo-gallery__image"
          src="{{ photo.image | relative_url }}"
          alt="{{ photo.alt | escape }}"
          loading="lazy"
        >
      </div>

      <figcaption class="photo-gallery__caption">
        <h2 class="photo-gallery__title">{{ photo.title }}</h2>
        <p class="photo-gallery__meta">
          <time datetime="{{ photo.date_iso }}">{{ photo.date }}</time>
          {% if photo.location %}<span aria-hidden="true"> · </span>{{ photo.location }}{% endif %}
        </p>
        {% if photo.description %}
          <p class="photo-gallery__description">{{ photo.description }}</p>
        {% endif %}
      </figcaption>
    </figure>
  {% endfor %}
</div>

<style>
  .photo-gallery {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 2.5rem 1.5rem;
    margin-top: 1rem;
  }

  .photo-gallery__item {
    min-width: 0;
    margin: 0;
  }

  .photo-gallery__item--featured {
    grid-column: 1 / -1;
    width: min(100%, 48rem);
    justify-self: center;
  }

  .photo-gallery__media {
    overflow: hidden;
    border-radius: 0.35rem;
    background: var(--global-border-color);
  }

  .photo-gallery__image {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    margin: 0;
    object-fit: cover;
    transition: transform 0.45s ease;
  }

  .photo-gallery__item:hover .photo-gallery__image {
    transform: scale(1.018);
  }

  .photo-gallery__caption {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: baseline;
    gap: 0 1rem;
    margin-top: 0.65rem;
  }

  .photo-gallery__title {
    margin: 0;
    font-size: 1em;
    line-height: 1.35;
  }

  .photo-gallery__meta {
    margin: 0;
    color: var(--global-text-color-light);
    font-size: 0.82em;
    white-space: nowrap;
  }

  .photo-gallery__description {
    grid-column: 1 / -1;
    margin: 0.4rem 0 0;
    color: var(--global-text-color-light);
    font-size: 0.88em;
    line-height: 1.55;
  }

  @media (prefers-reduced-motion: reduce) {
    .photo-gallery__image {
      transition: none;
    }

    .photo-gallery__item:hover .photo-gallery__image {
      transform: none;
    }
  }

  @media (max-width: 600px) {
    .photo-gallery {
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    .photo-gallery__item--featured {
      grid-column: auto;
      width: 100%;
    }

    .photo-gallery__caption {
      grid-template-columns: 1fr;
    }

    .photo-gallery__meta {
      margin-top: 0.2rem;
      white-space: normal;
    }

    .photo-gallery__description {
      grid-column: auto;
    }
  }
</style>
